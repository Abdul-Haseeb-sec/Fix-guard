name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Run tests
      run: |
        cd examples/dead-code-bypass
        python -m unittest test_detector -v
      
    - name: Run variant sync check
      run: bash scripts/check-variant-sync.sh
